name: WorkoutSync
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  WorkoutSync:
    type: application
    platform: iOS
    sources: [WorkoutSyncApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahagun.workoutsync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Workout Sync
